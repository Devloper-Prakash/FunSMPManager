name: Fun SMP Manager - Build Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'funSMPManager.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="funSMPManager.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            echo "Upload funSMPManager.zip to the repository root."
            exit 1
          fi

          echo "Source ZIP found."
          unzip -t "$ZIP_FILE"

      - name: Extract Plugin Source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -q funSMPManager.zip -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Gradle Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find extracted -name build.gradle.kts -type f -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="$(find extracted -name build.gradle -type f -print -quit)"
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Gradle build file not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Plugin
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean build

      - name: Verify JAR
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/build-output/" \;

          if ! compgen -G "$GITHUB_WORKSPACE/build-output/*.jar" > /dev/null; then
            echo "::error::No plugin JAR produced."
            exit 1
          fi

          echo "Build output:"
          ls -lh "$GITHUB_WORKSPACE/build-output"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FunSMPManager-Plugin
          path: build-output/*.jar
          if-no-files-found: error
          retention-days: 14
