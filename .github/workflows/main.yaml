
name: Build FunSMPManager from ZIP

on:
  push:
    branches: [main, master]
    paths:
      - "FunSMPManager-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract, Build, Test and Upload JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "FunSMPManager-source.zip" ]]; then
            echo "::error::FunSMPManager-source.zip not found in repository root."
            exit 1
          fi

      - name: Extract source ZIP automatically
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/funsmp-source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q -o "FunSMPManager-source.zip" -d "$EXTRACT_DIR"

          PROJECT_DIR="$(find "$EXTRACT_DIR" \
            -type f -name settings.gradle -printf '%h\n' -quit)"

          if [[ -z "$PROJECT_DIR" ]]; then
            PROJECT_DIR="$(find "$EXTRACT_DIR" \
              -type f -name settings.gradle.kts -printf '%h\n' -quit)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::No Gradle project found inside the ZIP."
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project extracted to: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "::error::build.gradle or build.gradle.kts is missing."
            exit 1
          fi

          if [[ ! -f src/main/resources/plugin.yml ]]; then
            echo "::error::src/main/resources/plugin.yml is missing."
            exit 1
          fi

      - name: Build and run tests
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew clean test build --no-daemon
          else
            # Generate a wrapper because the source ZIP may not include one.
            gradle wrapper --gradle-version 8.10.2
            ./gradlew clean test build --no-daemon
          fi

      - name: Locate and verify plugin JAR
        id: jar
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          JAR_FILE="$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"

          if [[ -z "$JAR_FILE" || ! -s "$JAR_FILE" ]]; then
            echo "::error::No compiled JAR found in build/libs."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/funsmp-artifact"
          cp "$JAR_FILE" \
            "$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar"

          jar tf "$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar" \
            > "$RUNNER_TEMP/funsmp-artifact/jar-contents.txt"

          if ! grep -q '^plugin.yml$' \
            "$RUNNER_TEMP/funsmp-artifact/jar-contents.txt"; then
            echo "::error::plugin.yml is missing from the JAR."
            exit 1
          fi

          echo "JAR verified."
          echo "jar_path=$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar" \
            >> "$GITHUB_OUTPUT"

      - name: Upload compiled plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FunSMPManager-JAR
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always() && steps.extract.outputs.project_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: FunSMPManager-Test-Reports
          path: ${{ steps.extract.outputs.project_dir }}/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
