
name: Build FunSMPManager from ZIP

on:
  push:
    branches: [main, master]
    paths:
      - "FunSMPManager-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract, Build, Test, and Publish JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP automatically
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FunSMPManager-source.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/funsmp-source"
          unzip -q -o "$ZIP_FILE" -d "$RUNNER_TEMP/funsmp-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/funsmp-source" \
            -type f -name settings.gradle -printf '%h\n' -quit)"

          if [[ -z "$PROJECT_DIR" ]]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/funsmp-source" \
              -type f -name settings.gradle.kts -printf '%h\n' -quit)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::No Gradle project found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "::error::Gradle build file missing."
            exit 1
          fi

          test -f src/main/resources/plugin.yml

      - name: Build and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew clean test build --no-daemon
          else
            gradle wrapper --gradle-version 8.10.2
            ./gradlew clean test build --no-daemon
          fi

      - name: Verify compiled JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"

          if [[ -z "$JAR_FILE" || ! -s "$JAR_FILE" ]]; then
            echo "::error::Compiled JAR not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/funsmp-artifact"
          cp "$JAR_FILE" \
            "$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar"

          jar tf "$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar" \
            > "$RUNNER_TEMP/funsmp-artifact/jar-contents.txt"

          if ! grep -q '^plugin.yml$' \
            "$RUNNER_TEMP/funsmp-artifact/jar-contents.txt"; then
            echo "::error::plugin.yml missing from JAR."
            exit 1
          fi

          echo "JAR verified successfully."
          echo "jar_path=$RUNNER_TEMP/funsmp-artifact/FunSMPManager.jar" \
            >> "$GITHUB_OUTPUT"

      - name: Upload ready-to-download JAR
        uses: actions/upload-artifact@v4
        with:
          name: FunSMPManager-JAR
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: FunSMPManager-Test-Reports
          path: ${{ env.PROJECT_DIR }}/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
