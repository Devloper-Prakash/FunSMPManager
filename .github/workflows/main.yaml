name: Build FunSMPManager

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project with Maven
        run: mvn -B clean test package

      - name: Show build output
        run: ls -la target

      - name: Create zip artifact
        run: |
          mkdir -p build-output
          if [ -f target/FunSMPManager.jar ]; then
            cp target/FunSMPManager.jar build-output/
          else
            echo "Expected target/FunSMPManager.jar was not produced."
            exit 1
          fi

          zip -r Fun-SMP-Manager.zip build-output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fun-SMP-Manager
          path: Fun-SMP-Manager.zip
